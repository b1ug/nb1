name: Windows token native fixture

on:
  push:
    branches: [validation/windows-token-native]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  own-token:
    name: Windows token / ${{ matrix.arch }} / fresh ordinary user
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, '386']
    env:
      CGO_ENABLED: '0'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - name: Software-only injected lifecycle regressions
        shell: powershell
        run: |
          & .\ci\test-windows-token-native.ps1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'windows-token-fakes.json')
          if ($LASTEXITCODE -ne 0) { throw 'software fake regressions failed' }
      - name: Build exact own-token test binary without running native token tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:RUNNER_TEMP ('taskuser-native-' + $env:GOARCH + '.test.exe')
          & go test -c -o $binary ./internal/service/taskuser
          if ($LASTEXITCODE -ne 0) { throw 'test binary build failed' }
          $names = @(& $binary '-test.list=^TestNativeCurrentOptIn$')
          if ($LASTEXITCODE -ne 0 -or $names -cnotcontains 'TestNativeCurrentOptIn') { throw 'explicit native fixture is not integrated; refusing empty acceptance' }
          $metadata = [ordered]@{
            source = (& git rev-parse HEAD)
            arch = $env:GOARCH
            cgo_enabled = $env:CGO_ENABLED
            gowork = $env:GOWORK
            go_version = (& go version)
            binary_sha256 = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
            native_test_present = $true
            scope = 'Own-process token native fixture; no Task Scheduler or USB acceptance.'
          }
          $metadata | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'windows-token-build.json') -Encoding UTF8
      - name: Observe administrator rejection and fresh ordinary user acceptance
        shell: powershell
        run: |
          $binary = Join-Path $env:RUNNER_TEMP ('taskuser-native-' + $env:GOARCH + '.test.exe')
          & .\ci\windows-token-native.ps1 -Execute -Binary $binary -OutputDirectory (Join-Path $env:RUNNER_TEMP 'windows-token-native-evidence')
      - name: Require both native reports and exact cleanup
        if: ${{ always() }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'windows-token-native-evidence\results.json'
          if (-not (Test-Path -LiteralPath $path)) { throw 'native report missing; no environment green skip' }
          $report = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          $build = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'windows-token-build.json') -Raw | ConvertFrom-Json
          if ($report.status -cne 'PASS' -or $report.hardware_access -ne $false -or $report.task_mutations -ne $false -or $report.policy_changes -ne $false) { throw 'native acceptance or scope is not PASS' }
          if ($report.creation.attempted -ne $true -or $report.creation.returned -ne $true -or $report.creation.verified -ne $true -or $report.children_exit_proven -ne $true) { throw 'native account creation/attribution/private child exit proof is incomplete' }
          if ($report.binary_sha256 -cne $build.binary_sha256 -or $build.native_test_present -ne $true) { throw 'native report does not bind to the built test binary' }
          if (@($report.fixture_user.local_group_sids).Count -ne 1 -or $report.fixture_user.local_group_sids[0] -cne 'S-1-5-32-545' -or $report.profile_observation.sid -cne $report.fixture_user.sid) { throw 'fresh ordinary account/profile/group proof is incomplete' }
          if (@($report.cases).Count -ne 2 -or @($report.cases | Where-Object { $_.exit_code -ne 0 -or $_.native.status -cne 'PASS' }).Count -ne 0) { throw 'both native identity cases must PASS' }
          if (@($report.cases | Where-Object { $_.expected -ceq 'ordinary' }).Count -ne 1 -or @($report.cases | Where-Object { $_.expected -ceq 'administrator-rejected' }).Count -ne 1) { throw 'ordinary/admin cases are incomplete' }
          if (@($report.cleanup).Count -eq 0 -or @($report.cleanup | Where-Object { $_.status -cne 'PASS' }).Count -ne 0) { throw 'explicit child/profile/account/fixture cleanup must PASS' }
      - name: Compile Windows ARM64 only
        if: ${{ matrix.arch == 'amd64' }}
        shell: powershell
        run: |
          $env:GOARCH = 'arm64'
          & go test -c -o (Join-Path $env:RUNNER_TEMP 'taskuser-native-arm64-compile-only.test.exe') ./internal/service/taskuser
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 compile failed' }
      - name: Upload selected native fixture evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-token-native-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-token-fakes.json
            ${{ runner.temp }}/windows-token-build.json
            ${{ runner.temp }}/windows-token-native-evidence/results.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
