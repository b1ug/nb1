name: Runtime integration

on:
  push:
    branches: [validation/runtime-native]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: "1"
  GOWORK: ${{ github.workspace }}/go.work

jobs:
  native:
    name: Native runtime / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
    steps:
      - uses: actions/checkout@v7
        with:
          path: cli
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: b1ug/blink1-go
          ref: b3f2586cc73073a7a0432889ea14a18c13247f46
          path: sdk
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: b1ug/gid
          ref: 37d7cfde72ed26a7dffee470cc97ef7e735f3235
          path: gid
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false
      - name: Workspace and native toolchain
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          GOWORK=off go work init ./cli ./sdk ./gid
      - name: Build, race tests and vet
        run: |
          go build ./cli/... ./sdk/... ./gid/...
          go test -race -count=1 -timeout=3m ./cli/... ./sdk/... ./gid/...
          go vet ./cli/... ./sdk/... ./gid/...
      - name: Independent MCP module
        working-directory: cli/adapters/mcp
        env:
          GOWORK: "off"
        run: |
          go build ./...
          go test -race -count=1 -timeout=3m ./...
          go vet ./...
      - name: Command notification CLI contract
        run: |
          binary="$RUNNER_TEMP/nb1-notify$(go env GOEXE)"
          go build -o "$binary" ./cli
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_cmd=python
          else
            python_cmd=python3
          fi
          NB1_NOTIFY_TEST_BINARY="$binary" "$python_cmd" -m unittest discover -s cli/examples/command-notify -p 'test_*.py' -v

  legacy-cli:
    name: Go 1.18 CLI source / ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: cli
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: b1ug/blink1-go
          ref: b3f2586cc73073a7a0432889ea14a18c13247f46
          path: sdk
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: b1ug/gid
          ref: 37d7cfde72ed26a7dffee470cc97ef7e735f3235
          path: gid
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.18.10"
          cache: false
      - name: Test CLI source floor without the Go 1.25 MCP module
        run: |
          GOWORK=off go work init ./cli ./sdk ./gid
          go build ./cli/...
          go test -count=1 -timeout=3m ./cli/...

  legacy-sdk:
    name: Go 1.13 SDK and GID source / ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
        with:
          repository: b1ug/blink1-go
          ref: b3f2586cc73073a7a0432889ea14a18c13247f46
          path: sdk
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: b1ug/gid
          ref: 37d7cfde72ed26a7dffee470cc97ef7e735f3235
          path: gid
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.13.15"
          cache: false
      - name: Test SDK with the selected GID source
        working-directory: sdk
        run: |
          go mod edit -replace github.com/b1ug/gid=../gid
          go build ./...
          go test -count=1 -timeout=3m ./...
      - name: Test GID source floor
        working-directory: gid
        run: |
          go build ./...
          go test -count=1 -timeout=3m ./...

  windows-386:
    # A 32-bit process under WOW64 exercises the Go/C ABI; it is not evidence
    # for an older 32-bit Windows installation or physical USB behavior.
    name: Windows 386 runtime / WOW64
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GOOS: windows
      GOARCH: "386"
      CGO_ENABLED: "1"
      CC: gcc
    steps:
      - uses: actions/checkout@v7
        with:
          path: cli
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: b1ug/blink1-go
          ref: b3f2586cc73073a7a0432889ea14a18c13247f46
          path: sdk
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: b1ug/gid
          ref: 37d7cfde72ed26a7dffee470cc97ef7e735f3235
          path: gid
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          architecture: x64
          cache: false
      # MINGW32 is deprecated but currently still provides the i686 compiler;
      # UCRT64 and CLANG64 do not replace this 32-bit target.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: mingw-w64-i686-gcc
          path-type: inherit
      - name: Workspace and Windows 386 toolchain
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test "$(gcc -dumpmachine | tr -d '\r')" = i686-w64-mingw32
          test "$(go env GOOS)" = windows
          test "$(go env GOARCH)" = 386
          test "$(go env CGO_ENABLED)" = 1
          test "$(go env CC)" = gcc
          go version
          go env GOHOSTARCH GOOS GOARCH CGO_ENABLED CC
          gcc -dumpmachine
          GOWORK=off go work init ./cli ./sdk ./gid
      - name: Build, ordinary tests and vet without Windows 386 race support
        shell: msys2 {0}
        run: |
          set -euo pipefail
          go build ./cli/... ./sdk/... ./gid/...
          go test -count=1 -timeout=3m ./cli/... ./sdk/... ./gid/...
          go vet ./cli/... ./sdk/... ./gid/...
      - name: Independent MCP module on Windows 386
        shell: msys2 {0}
        working-directory: cli/adapters/mcp
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          go build ./...
          go test -count=1 -timeout=3m ./...
          go vet ./...

  standalone-modules:
    name: Standalone modules / Go 1.27 and MCP Go 1.25 floor
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOWORK: "off"
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          path: cli
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: b1ug/blink1-go
          ref: b3f2586cc73073a7a0432889ea14a18c13247f46
          path: sdk
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false
      - name: Verify standalone module graph without local replacements
        run: |
          set -euo pipefail
          test "$(go env GOWORK)" = off
          go version
          go env GOOS GOARCH CGO_ENABLED GOWORK GOTOOLCHAIN
          python3 - <<'PY'
          import json
          import subprocess

          sdk = "github.com/b1ug/blink1-go"
          gid = "github.com/b1ug/gid"
          sdk_version = "v0.0.2-0.20261109044941-b3f2586cc730"
          gid_version = "v0.0.3-0.20261109043911-37d7cfde72ed"
          for directory, dependencies in [
              ("cli", {sdk: sdk_version, gid: gid_version}),
              ("sdk", {gid: gid_version}),
          ]:
              for module, version in dependencies.items():
                  entry = json.loads(subprocess.check_output(
                      ["go", "list", "-mod=readonly", "-m", "-json", module],
                      cwd=directory, text=True,
                  ))
                  assert entry.get("Path") == module, entry
                  assert entry.get("Version") == version, entry
                  assert "Replace" not in entry and not entry.get("Main", False), entry
                  print(f"{directory}: {module}@{version}; no Replace or Main")
          PY
      - name: Build, race tests and vet standalone CLI
        working-directory: cli
        run: |
          go build -mod=readonly ./...
          go test -mod=readonly -race -count=1 -timeout=3m ./...
          go vet -mod=readonly ./...
      - name: Build, race tests and vet standalone SDK
        working-directory: sdk
        run: |
          go build -mod=readonly ./...
          go test -mod=readonly -race -count=1 -timeout=3m ./...
          go vet -mod=readonly ./...
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.0"
          cache: false
      - name: Build, ordinary tests and vet independent MCP Go 1.25 floor
        working-directory: cli/adapters/mcp
        run: |
          test "$(go env GOVERSION)" = go1.25.0
          test "$(go env GOWORK)" = off
          go build -mod=readonly ./...
          go test -mod=readonly -count=1 -timeout=3m ./...
          go vet -mod=readonly ./...

  systemd-user-lifecycle:
    # A fresh hosted VM runs a stdlib fixture as a dedicated ordinary user.
    # This exercises the real user manager, never the USB backend or nb1 server.
    name: Linux systemd user lifecycle / USB-free fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GOWORK: "off"
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          path: cli
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false
      - name: Build pinned standalone CLI and USB-free fixture
        working-directory: cli
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/nb1-systemd-user-evidence"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          expected = {
              "github.com/b1ug/blink1-go": "v0.0.2-0.20261109044941-b3f2586cc730",
              "github.com/b1ug/gid": "v0.0.3-0.20261109043911-37d7cfde72ed",
          }
          modules = {}
          for module, version in expected.items():
              entry = json.loads(subprocess.check_output(
                  ["go", "list", "-mod=readonly", "-m", "-json", module], text=True,
              ))
              if entry.get("Path") != module or entry.get("Version") != version or "Replace" in entry or entry.get("Main", False):
                  raise SystemExit("standalone dependency pin mismatch: " + module)
              modules[module] = version
          toolchain = json.loads(subprocess.check_output(
              ["go", "env", "-json", "GOVERSION", "GOOS", "GOARCH", "CGO_ENABLED", "GOWORK", "GOTOOLCHAIN"], text=True,
          ))
          if toolchain["GOOS"] != "linux" or toolchain["CGO_ENABLED"] != "0" or toolchain["GOWORK"] != "off":
              raise SystemExit("USB-free standalone Linux build environment was not established")
          metadata = {"source_revision": os.environ["GITHUB_SHA"], "modules": modules, "toolchain": toolchain,
                      "scope": "Real Linux user-manager lifecycle with a USB-free stdlib fixture; no real USB acceptance."}
          destination = Path(os.environ["RUNNER_TEMP"]) / "nb1-systemd-user-evidence" / "build-metadata.json"
          destination.write_text(json.dumps(metadata, indent=2, sort_keys=True) + "\n")
          print(json.dumps(metadata, sort_keys=True))
          PY
          go build -mod=readonly -o "$RUNNER_TEMP/nb1-systemd-cli" . 2>&1 | tee "$RUNNER_TEMP/nb1-systemd-user-evidence/build.log"
          go build -mod=readonly -o "$RUNNER_TEMP/nb1-systemd-fixture" ./ci/systemd-user-fixture 2>&1 | tee -a "$RUNNER_TEMP/nb1-systemd-user-evidence/build.log"
      - name: Exercise native user lifecycle and every refusal case
        working-directory: cli
        run: |
          set -euo pipefail
          # The harness confines sudo to this VM's fresh test account setup and
          # cleanup. Product/user-manager commands run as its ordinary UID/env -i.
          python3 ci/systemd-user-smoke.py --execute \
            --binary "$RUNNER_TEMP/nb1-systemd-cli" \
            --fixture "$RUNNER_TEMP/nb1-systemd-fixture" \
            --negative-case external-enable \
            --negative-case dropin \
            --negative-case mask \
            --negative-case transient \
            --negative-case need-reload \
            --negative-case bus-loss \
            --output "$RUNNER_TEMP/nb1-systemd-user-evidence/smoke" \
            2> "$RUNNER_TEMP/nb1-systemd-user-evidence/smoke.stderr.log" \
            | tee "$RUNNER_TEMP/nb1-systemd-user-evidence/smoke.stdout.json"
      - name: Require actual PASS, all refusal cases and explicit cleanup
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["RUNNER_TEMP"]) / "nb1-systemd-user-evidence"
          evidence.mkdir(mode=0o700, exist_ok=True)
          failures = []
          try:
              report = json.loads((evidence / "smoke" / "results.json").read_text())
              if report.get("status") != "PASS":
                  failures.append("native report is not PASS (environment-unavailable/prepared/failed never pass)")
              if report.get("hardware_access") is not False:
                  failures.append("report does not establish the USB-free fixture scope")
              guard = report.get("guard", {})
              if not all(guard.get(key) is True for key in ("github_actions_true", "linux", "systemd_pid1")):
                  failures.append("required hosted Linux/systemd environment was not established")
              negatives = report.get("negative_cases", {})
              expected = {"external-enable", "dropin", "mask", "transient", "need-reload", "bus-loss"}
              if not expected.issubset(negatives) or any(case.get("status") != "PASS" for case in negatives.values()):
                  failures.append("at least one available native refusal case did not PASS")
              cleanup = report.get("cleanup", [])
              if report.get("cleanup_failed") or not cleanup or any(step.get("status") != "PASS" for step in cleanup):
                  failures.append("explicit fresh-user/manager/process/file cleanup did not PASS")
          except (OSError, ValueError, TypeError, AttributeError) as error:
              failures.append("native evidence missing or invalid: " + str(error))
          verdict = {"status": "FAIL" if failures else "PASS", "failures": failures,
                     "scope": "USB-free fixture service acceptance; not Linux USB, login or reboot acceptance."}
          (evidence / "verdict.json").write_text(json.dumps(verdict, indent=2, sort_keys=True) + "\n")
          print(json.dumps(verdict, sort_keys=True))
          raise SystemExit(1 if failures else 0)
          PY
      - name: Upload selected lifecycle evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: systemd-user-usb-free-ubuntu-24.04-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nb1-systemd-user-evidence/build-metadata.json
            ${{ runner.temp }}/nb1-systemd-user-evidence/build.log
            ${{ runner.temp }}/nb1-systemd-user-evidence/smoke/results.json
            ${{ runner.temp }}/nb1-systemd-user-evidence/smoke.stdout.json
            ${{ runner.temp }}/nb1-systemd-user-evidence/smoke.stderr.log
            ${{ runner.temp }}/nb1-systemd-user-evidence/verdict.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
