name: Nonroot container validation

on:
  push:
    branches: [validation/nonroot-container, validation/runtime-native]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Linux nonroot image / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build native CGO image from pinned source dependencies
        run: docker build --progress=plain -t nb1-validation .
      - name: Validate USB-free runtime with no network or capabilities
        run: python3 tools/check-container.py --image nb1-validation --output artifacts/container.json
      - name: Preserve bounded validation receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nonroot-container-${{ matrix.os }}
          path: artifacts/container.json
          if-no-files-found: warn
          retention-days: 14
