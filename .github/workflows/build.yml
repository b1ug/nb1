name: 编译候选（仅验证）

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-candidate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: "1"
  GOWORK: "off"
  GOTOOLCHAIN: local
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    name: Native candidate / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, goos: linux, goarch: amd64, extension: ""}
          - {os: ubuntu-24.04-arm, goos: linux, goarch: arm64, extension: ""}
          - {os: macos-15, goos: darwin, goarch: arm64, extension: ""}
          - {os: macos-15-intel, goos: darwin, goarch: amd64, extension: ""}
          - {os: windows-2022, goos: windows, goarch: amd64, extension: .exe}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          cache: true
      - name: Check artifact validation helpers
        run: python3 -B -m unittest discover -s ci -p test_build_artifact.py -v
      - name: Check offline Homebrew draft renderer without installation
        run: python3 -B -m unittest discover -s packaging/homebrew -p test_render_formula.py -v
      - name: Build native CLI from public module versions
        env:
          NB1_CANDIDATE_BINARY: ${{ runner.temp }}/nb1-candidate-build/nb1${{ matrix.extension }}
        run: |
          mkdir -p "$(dirname "$NB1_CANDIDATE_BINARY")"
          go build -mod=readonly -trimpath -o "$NB1_CANDIDATE_BINARY" .
      - name: Check Formula help calls against the native Mac candidate without Homebrew
        if: runner.os == 'macOS'
        working-directory: packaging/homebrew
        env:
          NB1_HOMEBREW_TEST_BINARY: ${{ runner.temp }}/nb1-candidate-build/nb1
        run: |
          ruby --version
          python3 -B -m unittest test_render_formula.FormulaDraftTests.test_rendered_formula_help_calls_use_current_binary -v
      - name: Stage and verify source-bound candidate without USB
        env:
          NB1_CANDIDATE_BINARY: ${{ runner.temp }}/nb1-candidate-build/nb1${{ matrix.extension }}
          NB1_CANDIDATE_OUTPUT: ${{ runner.temp }}/nb1-candidate
          NB1_CANDIDATE_SOURCE: ${{ github.sha }}
          NB1_CANDIDATE_OS: ${{ matrix.goos }}
          NB1_CANDIDATE_ARCH: ${{ matrix.goarch }}
        run: |
          python3 ci/check-build-artifact.py stage \
            --binary "$NB1_CANDIDATE_BINARY" --out "$NB1_CANDIDATE_OUTPUT" \
            --expected-source "$NB1_CANDIDATE_SOURCE" \
            --expected-os "$NB1_CANDIDATE_OS" --expected-arch "$NB1_CANDIDATE_ARCH"
          python3 ci/check-build-artifact.py verify --out "$NB1_CANDIDATE_OUTPUT"
      - name: Preserve verified candidate (not a Release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nb1-candidate-${{ github.sha }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/nb1-candidate
          if-no-files-found: error
          retention-days: 14
