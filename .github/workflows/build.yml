name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOWORK: "off"
  GOTOOLCHAIN: local
  GID_TEST_ENUMERATE: "0"
  GID_TEST_DEVICE_PATH: ""

jobs:
  native:
    name: Native / ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
        go: ["1.26.x", "1.27.x"]
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Record toolchain and locked modules
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          gcc --version
          go list -mod=readonly -m -json all
          go mod verify
      - name: Build native CLI
        run: |
          binary=nb1
          if [[ "$RUNNER_OS" == Windows ]]; then binary=nb1.exe; fi
          mkdir -p build
          go build -mod=readonly -trimpath -buildvcs=true \
            -ldflags "-X github.com/b1ug/nb1/config.GitCommit=$GITHUB_SHA -X github.com/b1ug/nb1/config.CIBuildNum=gh$GITHUB_RUN_NUMBER" \
            -o "build/$binary" .
          go version -m "build/$binary" > build/build-info.txt
      - name: Test software paths without listing or opening hardware
        run: go test -mod=readonly -race -count=1 -timeout=3m -v ./...
      - name: Vet source
        run: go vet -mod=readonly ./...
      - name: Record development artifact source and checksums
        if: ${{ matrix.go == '1.27.x' }}
        run: |
          {
            echo "Development CI artifact; not a tagged release."
            git rev-parse HEAD
            go version
            go env GOOS GOARCH CGO_ENABLED
          } > build/source.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          directory = Path("build")
          records = [hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name
                     for p in sorted(directory.iterdir()) if p.is_file()]
          (directory / "SHA256SUMS").write_text("\n".join(records) + "\n")
          PY
      - name: Upload development CLI and provenance
        if: ${{ matrix.go == '1.27.x' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nb1-ci-${{ runner.os }}-${{ runner.arch }}
          path: build/
          if-no-files-found: error
          retention-days: 14

  source-floor:
    name: Source floor / ubuntu-22.04 / Go 1.18.10 / CGO0
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.18.10"
          cache: false
      - name: Build and test the declared Go source floor
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED
          go mod verify
          go build -mod=readonly ./...
          go test -mod=readonly -count=1 -timeout=3m -v ./...
